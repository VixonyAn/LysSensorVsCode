<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Lys og Liv</title>
    <!-- Import Styles -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/styles.css" />
    <!-- Import Vue.js -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>
  <body>
    <div id="app"></section>
      <header>
        <div class="HeaderNavBar">

          <nav class="navbar">
            <button @click="toggleMenu"><img src="./img/BurgerMenu.png" alt="BurgerMenu"></button>
            <div class="nav-links"v-if="menuOpen" >
              <a href="#">Lys og Liv</a>
              <a href="#">Data</a>
              <a href="#">Om os</a>
            </div>
          </nav>

          <img class="logoImg"src="./img/Logo.png" alt="Lys og Liv Logo">

          <p>UV: {{ uvIndex }}</p>

        </div>
        
          <p class="sunscreen">{{ sunscreen }}</p>

      </header>
   
      <main >
        <section class="mainBtns">
          <button><img class="image" v-bind:src="sunBtn.src" v-bind:alt="sunBtn.desc"></button>
          <button><img class="image" v-bind:src="moonBtn.src" v-bind:alt="moonBtn.desc"></button>
          <button><img class="image" v-bind:src="lightSwitch.src" v-bind:alt="lightSwitch.desc"></button>
          <button><img class="image" v-bind:src="nightSwitch.src" v-bind:alt="nightSwitch.desc"></button>
          <button><img class="image" v-bind:src="blindsOpen.src" v-bind:alt="blindsOpen.desc"></button>
          <button><img class="image" v-bind:src="blindsClose.src" v-bind:alt="blindsClose.desc"></button>
        </section>
        
        
      </main>



      <footer>
        <article>
          <p>You have in all saved {{ savedEnergy }} hours of energy.</p>
        </article>
      </footer>




     </div>

    <!-- Import App -->
    <script src="./js/main.js"></script>

    <!-- Mount App -->
    <script>
      const mountedApp = app.mount('#app')
    </script>
  </body>
</html>
