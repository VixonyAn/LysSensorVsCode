<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Lys og Liv</title>
    <!-- Import Styles -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/styles.css" />
    <!-- Import Vue.js -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>
  <body>
    <div id="app">
      <header>
        <div class="HeaderNavBar">

          <nav class="navbar">
            <button id="btnBurger" @click="toggleMenu"><img src="./img/BurgerMenu.png" alt="BurgerMenu"></button>
            <div class="nav-links"v-if="menuOpen" >
              <a href="/Vue/index.html">Lys og Liv</a>
              <a href="/Vue/data.html">Data</a>
              <a href="/Vue/alarm.html">Alarm</a>
            </div>
          </nav>

          <img class="logoImg"src="./img/Logo.png" alt="Lys og Liv Logo">
          <p>UV: {{ uvResult.uv }}</p>
        </div>
        
          <p class="sunscreen">{{ sunscreen }}</p>
      </header>


   
      <main class="IndexMain AlarmMain">
        <label>Hours (0–23):</label>
        <input type="number" v-model.number="inputHours"><br><br>

        <label>Minutes (0–59):</label>
        <input type="number" v-model.number="inputMinutes"><br><br>

        <button @click="timer">{{ timerId ? 'Stop' : 'Start Timer' }}</button>

        <p>{{ display }}</p>
        
      </main>



      <footer>

      </footer>




     </div>



      <!-- Axios (global) -->
      <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
      <!-- Import App (uses global Vue and axios) -->
      <script src="./js/main.js"></script>

  </body>
</html>
